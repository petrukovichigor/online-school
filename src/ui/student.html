<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online School — Student</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="student">
<aside class="side">
  <div class="brand"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#F2C94C"/><path d="M8 13c4.5-2 8.500-2 12 1v15c-3.500-3-7.500-3-12-1zM32 13c-4.500-2-8.500-2-12 1v15c3.500-3 7.500-3 12-1z" fill="#0F4C5C"/><path d="M26 6h5v9l-2.500-2L26 15z" fill="#B3402F"/></svg><span>Online <b>School</b></span></div>
  <button class="nav on" data-go="catalog">Catalog</button>
  <button class="nav" data-go="my">My courses</button>
  <button class="nav" data-go="payments">Payments</button>
  <button class="nav" data-go="grades">My grades</button>
  <div class="me"><b id="userName">Student</b><span id="userEmail"></span><br><button id="logout">Log out</button></div>
</aside>
<main>
  <section class="screen on" id="catalog">
    <h1>Course catalog</h1><p class="sub">Find a course by title, teacher or price.</p>
    <div class="toolbar">
      <input class="grow" id="q" type="search" placeholder="Search by title, teacher or description">
      <select id="sort"><option value="title">By title</option><option value="price_asc">Cheapest first</option><option value="price_desc">Most expensive first</option><option value="teacher">By teacher</option></select>
      <input id="pmin" type="number" min="0" placeholder="from, BYN"><input id="pmax" type="number" min="0" placeholder="to, BYN">
      <label class="chk"><input type="checkbox" id="hide"> Hide purchased</label>
      <button class="btn ghost sm" id="reset">Reset</button>
    </div>
    <div class="chips" id="chips"></div><p class="count" id="count"></p><div class="grid" id="courseGrid"></div>
  </section>
  <section class="screen" id="course">
    <button class="back" data-go="catalog">‹ Back to catalog</button>
    <div class="row"><div class="panel" style="flex:2"><h1 id="cTitle"></h1><p class="sub" id="cMeta"></p><p id="cDesc"></p><h2>Course program</h2><ul class="list" id="cLessons"></ul></div>
    <div class="panel"><div class="price" style="font-size:26px" id="cPrice"></div><p class="sub" id="cState" style="margin:8px 0 16px"></p>
      <div class="acts" style="flex-direction:column"><button class="btn" id="cBuy"></button><button class="btn ghost danger" id="cSec" hidden></button></div></div></div>
  </section>
  <section class="screen" id="my">
    <h1>My courses</h1><p class="sub">Lessons unlock after payment.</p>
    <div class="tabs" id="myTabs"></div><div class="grid" id="myGrid"></div>
  </section>
  <section class="screen" id="lessons">
    <button class="back" data-go="my">‹ My courses</button><h1 id="lTitle"></h1><p class="sub" id="lTeacher"></p>
    <div class="row"><div class="panel" style="flex:2"><iframe class="video" id="video" title="Video lesson" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe><h2 id="lessonTitle"></h2><div id="hwBox"></div></div>
    <div class="panel"><b>Lessons</b><ul class="list" id="lessonList" style="margin-top:8px"></ul></div></div>
  </section>
  <section class="screen" id="payments">
    <h1>Payments</h1><p class="sub">Payment and refund history.</p>
    <div class="stats" id="payStats"></div>
    <div class="toolbar"><select id="payF"><option value="">All statuses</option><option value="paid">Paid</option><option value="pending">Awaiting payment</option><option value="refunded">Refunded</option></select></div>
    <div id="payBox"></div>
  </section>
  <section class="screen" id="grades">
    <h1>My grades</h1><p class="sub">Scale 1–10; a grade appears after your work is reviewed.</p>
    <div class="stats" id="gStats"></div>
    <div class="toolbar"><select id="gF"><option value="">All submissions</option><option value="done">Reviewed</option><option value="wait">Under review</option></select></div>
    <div id="gradesBox"></div>
  </section>
</main>
<dialog id="dlg"></dialog><div class="toast" id="toast"></div>
<script src="js/theme.js"></script>
<script src="js/app.js"></script></body></html>
